plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quickstart'
    compileSdk 34

    defaultConfig {
        applicationId "com.quickstart"
        minSdk 21
        targetSdk 34
        versionCode 200
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            def ksPassFile = rootProject.file('kp.txt')
            if (ksPassFile.exists()) {
                storeFile rootProject.file('kuaishouqi-release.p12')
                storePassword ksPassFile.text.trim()
                keyAlias 'kuaishouqi'
                keyPassword ksPassFile.text.trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 刻意不回退 signingConfigs.debug：debug key 换机就失效，是最坑的假象
            if (rootProject.file('kp.txt').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'

    // FlexboxLayout: 自动换行布局
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // TinyPinyin: lightweight Chinese-to-pinyin library
    implementation 'com.github.promeg:tinypinyin:2.0.3'

    // ZXing core: QR code generation & decoding (pure Java, no camera code)
    implementation 'com.google.zxing:core:3.5.3'

    // Preference
    implementation 'androidx.preference:preference:1.2.1'

    // ProcessLifecycleOwner: 监听 APP 前后台切换
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
}
