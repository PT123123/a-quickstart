plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quickstart'
    compileSdk 34

    defaultConfig {
        applicationId "com.quickstart"
        minSdk 21
        targetSdk 34
        versionCode 301
        versionName "3.0.1"
    }

    signingConfigs {
        release {
            // 统一使用用户目录下的共同 keystore（与原件 SHA256 一致）
            // C:\Users\<user>\keystores\debug.keystore
            def ksFile = new File(System.getProperty('user.home'), 'keystores/debug.keystore')
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 刻意不回退 signingConfigs.debug：debug key 换机就失效，是最坑的假象
            def ksFile = new File(System.getProperty('user.home'), 'keystores/debug.keystore')
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'

    // FlexboxLayout: 自动换行布局
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // TinyPinyin: lightweight Chinese-to-pinyin library
    implementation 'com.github.promeg:tinypinyin:2.0.3'

    // ZXing core: QR code generation & decoding (pure Java, no camera code)
    implementation 'com.google.zxing:core:3.5.3'

    // Preference
    implementation 'androidx.preference:preference:1.2.1'

    // ProcessLifecycleOwner: 监听 APP 前后台切换
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // 单元测试
    testImplementation 'junit:junit:4.13.2'
}
